name: MAZKION AI Collaboration

on:
  pull_request:
    types: [opened, synchronize, reopened]

  # 사람이 Issue #1에 새 댓글을 남기면 양방향 AI 토론을 실행한다.
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "검토할 GitHub PR 번호"
        required: true
        type: string
      issue_number:
        description: "종합 보고서를 남길 Issue 번호"
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: mazkion-ai-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number || 'manual' }}
  cancel-in-progress: false

jobs:
  ai-review:
    # Issue #1의 사람 댓글만 토론을 시작한다. AI 봇 댓글은 루프 방지를 위해 제외한다.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 1 &&
       !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.user.login != 'github-actions[bot]')
      ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !startsWith(github.head_ref, 'night/'))
      ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout trusted workflow files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run MAZKION AI collaboration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '1' }}
          ISSUE_COMMENT_ID: ${{ github.event.comment.id }}
        run: node .github/scripts/ai-discussion.mjs
