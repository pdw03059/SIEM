name: MAZKION AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "검토할 GitHub PR 번호"
        required: true
        type: string
      issue_number:
        description: "종합 보고서를 남길 Issue 번호"
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: maz kion-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted workflow files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run MAZKION AI Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '1' }}

        run: node .github/scripts/ai-discussion.mjs
