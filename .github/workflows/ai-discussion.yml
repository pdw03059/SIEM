name: MAZKION AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "검토할 GitHub PR 번호"
        required: true
        type: string
      issue_number:
        description: "종합 보고서를 남길 Issue 번호"
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: maz kion-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  ai-review:
    # 비용 방지: 유료 AI 리뷰는 수동 실행 또는 "초안이 아니고 night/ 브랜치가 아닌" PR에서만 실행한다.
    # 밤 작업은 night/* 초안 PR에 30분마다 push하므로, 이 조건이 없으면 push마다 유료 API가 호출된다.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && !startsWith(github.head_ref, 'night/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout trusted workflow files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run MAZKION AI Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          ISSUE_NUMBER: ${{ inputs.issue_number || '1' }}

        run: node .github/scripts/ai-discussion.mjs
