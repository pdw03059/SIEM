name: MAZKION Automation Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/*.yml"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mazkion-automation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check Node.js
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"

      - name: Syntax-check every automation script
        run: |
          set -euo pipefail
          find .github/scripts -type f -name "*.mjs" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
